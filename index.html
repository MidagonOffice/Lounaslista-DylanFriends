<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dylan & Friends – lounas</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#183b34;background:#f5f4ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}.head{background:#173d36;color:white;padding:3vh 5vw}.brand{font-size:clamp(17px,2vw,28px);letter-spacing:.13em}.head h1{font-size:clamp(38px,5vw,82px);margin:.3em 0 .1em}.date{font-size:clamp(19px,2.3vw,34px)}main{padding:3vh 5vw;flex:1}.dishes{display:grid;grid-template-columns:1fr 1fr;gap:1.5vh 3vw}.dish{font-size:clamp(19px,2.1vw,36px);line-height:1.28;padding:1.3vh 0;border-bottom:1px solid #cad4ce}.footer{padding:1.5vh 5vw;color:#4d625a;font-size:clamp(13px,1.2vw,19px)}@media(max-width:700px){.dishes{grid-template-columns:1fr}}
</style></head><body><header class="head"><div class="brand">DYLAN & FRIENDS · KEILANIEMI</div><h1>Tänään lounaalla</h1><div class="date" id="date">Ladataan ruokalistaa…</div></header><main><div class="dishes" id="dishes"></div></main><footer class="footer" id="status">Ruokalista: Lounastaja</footer><script>
const days=['sunnuntai','maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai'];let cache=null;
function todayFi(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function show(data){const date=todayFi();const day=new Date(date+'T12:00:00Z');const heading=days[day.getUTCDay()]+' '+date.slice(8,10)+'.'+date.slice(5,7)+'.'+date.slice(0,4);document.getElementById('date').textContent=heading[0].toUpperCase()+heading.slice(1);const entry=data.items.find(i=>i.date===date);const dishes=document.getElementById('dishes');dishes.replaceChildren();if(!entry){const p=document.createElement('div');p.className='dish';p.textContent='Tälle päivälle ei ole julkaistu lounaslistaa.';dishes.append(p);return}entry.lines.forEach(line=>{const p=document.createElement('div');p.className='dish';p.textContent=line;dishes.append(p)})}
async function refresh(){try{const r=await fetch('./menu.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);cache=await r.json();show(cache);document.getElementById('status').textContent='Lähde: Dylan & Friends / Lounastaja · Päivitetty '+new Date(cache.updated).toLocaleString('fi-FI',{timeZone:'Europe/Helsinki'})}catch(e){if(cache)show(cache);document.getElementById('status').textContent='Ruokalistan päivitys ei onnistunut'+(cache?' – näytetään viimeksi haetut tiedot':'');if(!cache)document.getElementById('date').textContent='Ruokalistaa ei saatu ladattua'}}
refresh();setInterval(refresh,30*60*1000);setInterval(()=>{if(cache)show(cache)},60*1000);
</script></body></html>
